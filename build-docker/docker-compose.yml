version: '3.8'
services:
  nginx:
    image: nginx:1.23
    container_name: nginx
    volumes:
      - ../smart-react-vite-final/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt  # Mount SSL
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-spring

  db-mysql:
    image: mysql:5.7.40
    container_name: mysql
    restart: always
    environment:
      - MYSQL_DATABASE=smart
      - MYSQL_ROOT_PASSWORD=123456
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend-spring:
    build:
      context: ../smart-java-spring-final
      dockerfile: Dockerfile
    container_name: backend-spring
    ports:
      - "8088:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/smart
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PROJECT_UPLOAD_FILE_BASE_URI=file:///uploads/
    depends_on:
      - db-mysql
    volumes:
      - ../upload-docker/:/uploads/

volumes:
  mysql-data:
