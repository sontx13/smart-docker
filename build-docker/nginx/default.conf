upstream backend-spring-rest {
    server backend-spring:8080;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name vnptbacninh.com www.vnptbacninh.com;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name vnptbacninh.com www.vnptbacninh.com;

    ssl_certificate /etc/letsencrypt/live/vnptbacninh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vnptbacninh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend build (React/Vite/Next)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api {
        proxy_pass http://backend-spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files served by backend
    location /storage {
        proxy_pass http://backend-spring:8080;
    }
}
